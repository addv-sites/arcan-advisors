name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ajusta URLs estáticas para PROD (base /arcan-advisors/)
        if: github.repository == 'addv-sites/arcan-advisors'
        run: |
          echo "Parchando public/ para PROD (base /arcan-advisors/)..."
          sed -i 's|/arcan-prototipo/|/arcan-advisors/|g' public/manifest.webmanifest
          sed -i 's|https://addv-prototipos.github.io/arcan-prototipo/|https://addv-sites.github.io/arcan-advisors/|g' public/sitemap.xml
          sed -i 's|https://addv-prototipos.github.io/arcan-prototipo/|https://addv-sites.github.io/arcan-advisors/|g' public/robots.txt
          echo "--- manifest ---"; cat public/manifest.webmanifest
          echo "--- sitemap ---"; cat public/sitemap.xml
          echo "--- robots ---"; cat public/robots.txt

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
